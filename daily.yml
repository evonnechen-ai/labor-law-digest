name: 勞動法令日報

on:
  schedule:
    # GitHub 使用 UTC 時間：23:20 UTC = 台灣時間早上 07:20
    - cron: "20 23 * * *"
  workflow_dispatch: {}   # 可在 Actions 頁面手動按「Run workflow」測試

permissions:
  contents: write   # 允許把推播紀錄 sent_history.json 存回專案，避免重複推播

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      - name: 儲存推播紀錄
        run: |
          if [ -f sent_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add sent_history.json
            git diff --cached --quiet || (git commit -m "更新推播紀錄" && git push)
          fi
